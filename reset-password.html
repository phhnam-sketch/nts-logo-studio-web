<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#711A37" />
  <title>Đặt lại mật khẩu · NTS Logo Studio</title>
  <link rel="icon" href="assets/brand/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/reset.css" />
</head>
<body>
  <div id="globalToast" class="toast" role="status" aria-live="polite">
    <div class="toast-icon" id="toastIcon">i</div>
    <div class="toast-copy"><strong id="toastTitle">Thông báo</strong><span id="toastMessage"></span></div>
    <button id="toastClose" class="icon-button" type="button">×</button>
  </div>

  <main class="reset-shell">
    <section class="reset-card">
      <div class="brand-lockup reset-brand">
        <img class="brand-logo-image" src="assets/brand/logo.svg" alt="NTS" />
        <div><div class="brand-name">LOGO STUDIO PRO</div><div class="brand-version">ACCOUNT RECOVERY</div></div>
      </div>
      <span class="auth-badge">SECURITY</span>
      <h1>Đặt mật khẩu mới</h1>
      <p>Đường dẫn khôi phục phải được mở từ email Supabase gửi cho bạn.</p>

      <form id="resetForm" class="auth-form">
        <div class="field">
          <label for="newPassword">Mật khẩu mới</label>
          <div class="input-shell">
            <span class="input-icon">•</span>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Tối thiểu 8 ký tự" />
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword">Nhập lại mật khẩu</label>
          <div class="input-shell">
            <span class="input-icon">✓</span>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Nhập lại mật khẩu" />
          </div>
        </div>
        <button id="resetSubmit" class="primary-button" type="submit">Cập nhật mật khẩu</button>
      </form>
      <a class="reset-back" href="./">← Quay lại đăng nhập</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
